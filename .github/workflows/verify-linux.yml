name: verify-linux

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qemu-user binutils-aarch64-linux-gnu
      - run: bash bootstrap/linux/verify_linux.sh
      - run: bash bootstrap/linux/verify_macho_linux.sh