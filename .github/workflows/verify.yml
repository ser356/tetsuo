name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ARM64
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x bootstrap/tetsuoc.macho && bash bootstrap/verify.sh

  linux:
    name: Linux AArch64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash bootstrap/linux/verify_native_elf.sh

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: bootstrap/windows/verify_native_x64.ps1
